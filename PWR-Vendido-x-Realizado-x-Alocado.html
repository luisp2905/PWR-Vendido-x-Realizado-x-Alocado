<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f4f6fb;
     color:#05244F;display:flex;flex-direction:column;overflow:hidden}
.nav{background:#05244F;flex-shrink:0;display:flex;align-items:center;gap:18px;padding:0 20px;height:58px}
.nav-brand{display:flex;align-items:center;gap:14px;flex-shrink:0}
.nav-brand svg{height:26px;display:block}
.nav-div{width:1px;height:26px;background:rgba(255,255,255,.2)}
.nav-title{font-size:13px;font-weight:600;color:#fff;white-space:nowrap}
.nav-tabs{display:flex;gap:2px;align-self:stretch}
.nav-tab{display:flex;align-items:center;padding:0 16px;font-family:inherit;font-size:13px;
         font-weight:500;color:rgba(255,255,255,.6);background:none;border:0;
         border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;
         transition:color .15s,border-color .15s}
.nav-tab:hover{color:#fff}
.nav-tab.active{color:#fff;border-bottom-color:#FF5B00}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0}
.nav-badge{font-size:11px;color:rgba(255,255,255,.75);background:rgba(255,255,255,.1);
           border:.5px solid rgba(255,255,255,.22);padding:4px 10px;border-radius:20px;white-space:nowrap}
.nav-ext{font-size:11px;color:rgba(255,255,255,.7);text-decoration:none;
         border:1px solid rgba(255,255,255,.3);padding:4px 10px;border-radius:20px;white-space:nowrap}
.nav-ext:hover{color:#fff;border-color:rgba(255,255,255,.6)}
.stage{position:relative;flex:1;min-height:0}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#f4f6fb}
.stage iframe.on{display:block}
@media(max-width:880px){
  .nav{height:auto;flex-wrap:wrap;padding:10px 12px;gap:10px}
  .nav-title,.nav-div{display:none}
  .nav-tabs{order:3;width:100%;overflow-x:auto}
  .nav-tab{padding:8px 12px;font-size:12px;border-bottom-width:2px}
  .nav-badge{font-size:10px;padding:3px 8px}
}
/* Impressão: o botão de PDF fica dentro de cada dashboard e imprime só o iframe.
   Se o usuário mandar Ctrl+P daqui, ao menos a barra some. */
@media print{
  .nav{display:none}
  body{overflow:visible;height:auto}
  .stage{position:static;flex:none}
  .stage iframe{position:static;height:100vh}
}
</style>

<script>
var META = {"vra": "8 semanas: 07/06–13/06 a 26/07–01/08", "exc": "Semana 26/07–01/08 · 26/07/2026 a 01/08/2026"};
var SRC  = {vra:'vra.html', exc:'excedentes.html'};
var TIT  = {vra:'PWR \u2014 Vendido \u00d7 Realizado \u00d7 Alocado',
            exc:'PWR \u2014 Horas Excedentes do Alocado'};
function show(k){
  if(!SRC[k]) k='vra';
  var tabs=document.querySelectorAll('.nav-tab');
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('active', tabs[i].dataset.k===k);
  ['vra','exc'].forEach(function(x){
    var fr=document.getElementById('fr-'+x);
    fr.classList.toggle('on', x===k);
    if(x===k && !fr.getAttribute('src')) fr.setAttribute('src', fr.dataset.src);
  });
  document.getElementById('badge').textContent = META[k] || '';
  document.getElementById('ext').href = SRC[k];
  document.title = TIT[k];
  if(location.hash.slice(1) !== k) history.replaceState(null, '', '#'+k);
}
Array.prototype.forEach.call(document.querySelectorAll('.nav-tab'), function(b){
  b.addEventListener('click', function(){ show(b.dataset.k); });
});
window.addEventListener('hashchange', function(){ show(location.hash.slice(1)); });
show(location.hash.slice(1) || 'vra');
</script>
